<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Axie's Piano Academy</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5bb6d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Axie Piano">
<link rel="manifest" href="manifest.webmanifest?v=2.2">
<link rel="icon" href="icon.svg?v=2.2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg?v=2.2">
<link rel="stylesheet" href="css/style.css?v=2.2">
</head>
<body>
<div class="bubbles" aria-hidden="true"></div>
<div id="app">
  <header id="topbar">
    <button id="btn-back" class="icon-btn" aria-label="Back">⬅</button>
    <div class="title-wrap">
      <h1 id="title">Axie's Piano Academy</h1>
      <span class="sub-tag">Young Pianist Edition · Sheet Music & 24 Levels</span>
    </div>
    <div class="pills">
      <span class="pill" id="pill-streak" title="Practice streak">🔥 <b>0</b></span>
      <span class="pill" id="pill-pearls" title="Pearls">🫧 <b>0</b></span>
    </div>
  </header>
  <div id="stage">
    <aside id="axie-pane"></aside>
    <main id="screen"></main>
  </div>
</div>
<div id="overlay"></div>
<div id="toasts" role="status" aria-live="polite"></div>

<script src="js/store.js?v=2.2"></script>
<script src="js/music.js?v=2.2"></script>
<script src="js/audio.js?v=2.2"></script>
<script src="js/axolotl.js?v=2.2"></script>
<script src="js/piano.js?v=2.2"></script>
<script src="js/staff.js?v=2.2"></script>
<script src="js/songs.js?v=2.2"></script>
<script src="js/curriculum.js?v=2.2"></script>
<script src="js/ui.js?v=2.2"></script>
<script src="js/games.js?v=2.2"></script>
<script src="js/songplayer.js?v=2.2"></script>
<script src="js/app.js?v=2.2"></script>
</body>
</html>
